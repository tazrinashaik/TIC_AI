<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#667eea">

    <meta name="description"
          content="AI Tic-Tac-Toe game using the Minimax Algorithm">

    <meta name="mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
          content="default">

    <meta name="apple-mobile-web-app-title"
          content="AI Tic-Tac-Toe">

    <title>AI Tic-Tac-Toe</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

</head>

<body>

    <main class="app">

        <!-- Header -->

        <header class="header">

            <div class="robot">
                🤖
            </div>

            <h1>AI Tic-Tac-Toe</h1>

            <p>
                Human vs Artificial Intelligence
            </p>

        </header>


        <!-- Player Information -->

        <section class="players">

            <div class="player-card active">

                <span class="symbol">
                    ❌
                </span>

                <div>
                    <small>PLAYER</small>
                    <strong>You</strong>
                </div>

            </div>


            <div class="player-card">

                <span class="symbol">
                    ⭕
                </span>

                <div>
                    <small>COMPUTER</small>
                    <strong>AI</strong>
                </div>

            </div>

        </section>


        <!-- Score Board -->

        <section class="score-board">

            <div class="score-item">

                <span>Player</span>

                <strong id="playerScore">
                    0
                </strong>

            </div>


            <div class="score-item">

                <span>Draw</span>

                <strong id="drawScore">
                    0
                </strong>

            </div>


            <div class="score-item">

                <span>AI</span>

                <strong id="aiScore">
                    0
                </strong>

            </div>

        </section>


        <!-- Game Status -->

        <div id="status"
             class="status">

            Your Turn ❌

        </div>


        <!-- Game Board -->

        <section id="board"
                 class="board"
                 aria-label="Tic-Tac-Toe board">

            <button class="cell"
                    data-index="0"
                    aria-label="Cell 1">
            </button>

            <button class="cell"
                    data-index="1"
                    aria-label="Cell 2">
            </button>

            <button class="cell"
                    data-index="2"
                    aria-label="Cell 3">
            </button>


            <button class="cell"
                    data-index="3"
                    aria-label="Cell 4">
            </button>

            <button class="cell"
                    data-index="4"
                    aria-label="Cell 5">
            </button>

            <button class="cell"
                    data-index="5"
                    aria-label="Cell 6">
            </button>


            <button class="cell"
                    data-index="6"
                    aria-label="Cell 7">
            </button>

            <button class="cell"
                    data-index="7"
                    aria-label="Cell 8">
            </button>

            <button class="cell"
                    data-index="8"
                    aria-label="Cell 9">
            </button>

        </section>


        <!-- New Game Button -->

        <button id="newGame"
                class="new-game">

            🔄 New Game

        </button>


        <!-- AI Information -->

        <section class="ai-info">

            <div class="ai-icon">
                🧠
            </div>

            <div>

                <h2>Minimax AI</h2>

                <p>
                    The computer analyzes possible
                    future moves and selects the
                    optimal move using the Minimax
                    algorithm.
                </p>

            </div>

        </section>


        <!-- Footer -->

        <footer>

            <p>
                AI Game Playing • Adversarial Search
            </p>

        </footer>

    </main>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
